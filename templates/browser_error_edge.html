  // Замерено по исходному скриншоту: где лежит и как выглядит текст «reg.ru».
  const TAB = {"cover":[68,12,168,20],"bg":"#333333","x":73,"baseline":25,"size":11.5,"color":"rgb(250,250,250)"};
  const BAR = {"cover":[106,47,1550,27],"bg":"#242424","x":108,"baseline":65,"size":14,"color":"rgb(250,250,250)"};

  // Selawik — метрически совместимая замена Segoe UI под OFL: в контейнере Segoe UI нет, без неё
  // строка «поехала» бы по ширине. Порядок важен: сначала встроенный, потом системный.
  const FONT = '"Selawik", "Segoe UI", Arial, sans-serif';

  function cover(rect, colour) {
    ctx.save();
    ctx.fillStyle = colour;
    ctx.fillRect(rect[0], rect[1], rect[2], rect[3]);
    ctx.restore();
  }

  function line(part, text, maxWidth) {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = part.color;
    ctx.font = '400 ' + part.size + 'px ' + FONT;

    // Длинную ссылку подрезаем по ширине полосы, чтобы она не налезала на иконки справа.
    let value = String(text || '');
    if (ctx.measureText(value).width > maxWidth) {
      while (value.length > 8 && ctx.measureText(value + '…').width > maxWidth) {
        value = value.slice(0, -1);
      }
      value += '…';
    }

    ctx.fillText(value, part.x, part.baseline);
    ctx.restore();
  }

  function draw(data) {
    const url = String((data && data.url) || '');
    const nick = String((data && data.nick) || '');
    const title = String((data && data.title) || '') || ('Steam Community :: ' + (nick || 'Steam User'));

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(background, 0, 0, W, H);

    // Вкладка: «Steam Community :: ник».
    cover(TAB.cover, TAB.bg);
    line(TAB, title, TAB.cover[2] - (TAB.x - TAB.cover[0]) - 10);

    // Адресная строка: сама ссылка. Chrome в жизни прячет схему, Edge показывает её как есть —
    // ровно так, как на исходных скриншотах.
    cover(BAR.cover, BAR.bg);
    line(BAR, BAR.stripScheme ? url.replace(/^https?:[/]{2}/i, '') : url, BAR.cover[2] - (BAR.x - BAR.cover[0]) - 10);
  }

  const fontReady = document.fonts ? document.fonts.load('400 14px Selawik').catch(() => null) : Promise.resolve(null);

  window.renderBrowserError = function renderBrowserError(data) {
    return new Promise((resolve) => {
      const go = () => {
        draw(data);
        requestAnimationFrame(() => {
          window.__renderReady = true;
          resolve(true);
        });
      };

      const waitImage = () => new Promise((done) => {
        if (background.complete && background.naturalWidth) {
          done();
        } else {
          background.onload = done;
          background.onerror = () => resolve(false);
        }
      });

      Promise.all([waitImage(), fontReady]).then(go);
    });
  };
})();
