<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge Mock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #000;
    }

    .edge-window {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .titlebar {
      height: 40px;
      background: #050505;
      display: flex;
      align-items: center;
      padding-left: 4px;
      position: relative;
    }

    .tab-actions-left {
      width: 34px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d6d6d6;
      font-size: 15px;
      margin-right: 4px;
    }

    .tab {
      height: 36px;
      width: 238px;
      background: #242424;
      border-radius: 9px 9px 0 0;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: #f1f1f1;
      font-size: 13px;
      margin-top: 4px;
      position: relative;
    }

    .tab::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: #242424;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      position: relative;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .tab-favicon::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 8px;
      height: 8px;
      border: 1.5px solid #333;
      border-radius: 50%;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
    }

    .tab-close {
      color: #d7d7d7;
      font-size: 18px;
      line-height: 1;
      margin-left: 8px;
      transform: translateY(-1px);
    }

    .new-tab {
      width: 36px;
      height: 36px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ddd;
      font-size: 26px;
      font-weight: 200;
    }

    .window-buttons {
      margin-left: auto;
      height: 40px;
      display: flex;
    }

    .window-btn {
      width: 46px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f1f1;
      font-size: 14px;
      font-weight: 300;
    }

    .window-btn.close {
      font-size: 20px;
    }

    .toolbar {
      height: 42px;
      background: #202020;
      border-bottom: 1px solid #313131;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 9px;
    }

    .nav-icon {
      width: 26px;
      height: 30px;
      color: #d3d3d3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 300;
    }

    .reload-icon {
      font-size: 20px;
      transform: rotate(-10deg);
    }

    .address-bar {
      flex: 1;
      height: 29px;
      background: #2b2b2b;
      border: 1px solid #474747;
      border-radius: 15px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: #e7e7e7;
      font-size: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .info-icon {
      width: 17px;
      height: 17px;
      border: 1.5px solid #9d9d9d;
      border-radius: 50%;
      margin-right: 8px;
      color: #bfbfbf;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    .url-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .url-protocol {
      color: #cfcfcf;
    }

    .url-domain {
      color: #ffffff;
      font-weight: 500;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 13px;
      padding-left: 6px;
      padding-right: 7px;
      color: #d9d9d9;
      font-size: 18px;
    }

    .profile {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #c8c8c8;
      position: relative;
      flex-shrink: 0;
    }

    .profile::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 8px;
      width: 7px;
      height: 7px;
      background: #8f8f8f;
      border-radius: 50%;
    }

    .profile::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 5px;
      width: 13px;
      height: 7px;
      background: #8f8f8f;
      border-radius: 8px 8px 4px 4px;
    }

    .page {
      height: calc(100vh - 82px);
      background: #2b2b2b;
      margin: 0 4px 4px 4px;
      border-radius: 6px 6px 0 0;
      border: 1px solid #363636;
      position: relative;
      overflow: hidden;
    }

    .error-content {
      position: absolute;
      left: 210px;
      top: 155px;
      color: white;
      width: 520px;
    }

    .cloud {
      width: 110px;
      height: 85px;
      margin-left: 4px;
      margin-bottom: 35px;
      filter: drop-shadow(0 0 7px rgba(255,255,255,0.45));
    }

    .cloud svg {
      width: 100%;
      height: 100%;
    }

    .error-title {
      margin: 0 0 23px;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .error-text {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
      color: #ffffff;
    }

    .try {
      margin-top: 19px;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 600;
    }

    ul {
      margin: 0 0 18px 25px;
      padding: 0;
      color: #ffffff;
      font-size: 14px;
      line-height: 2.1;
    }

    li {
      padding-left: 6px;
    }

    a {
      color: #50a7e8;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .error-code {
      margin-top: 20px;
      font-size: 11px;
      color: #8f8f8f;
      letter-spacing: 0.1px;
    }

    .refresh {
      margin-top: 22px;
      width: 87px;
      height: 40px;
      border: 0;
      border-radius: 4px;
      background: #0a84e8;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .edge-brand {
      position: absolute;
      left: 61px;
      bottom: 21px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .edge-logo {
	  width: 25px;
	  height: 25px;
	  display: block;
	  object-fit: contain;
	  flex-shrink: 0;
	  user-select: none;
	  -webkit-user-drag: none;
	}
    }
  </style>
</head>

<body>
  <div class="edge-window">
    <div class="titlebar">
      <div class="tab-actions-left">⌄</div>

      <div class="tab">
	  <img
		class="tab-favicon"
		alt=""
		src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Steam_icon_logo.svg/1280px-Steam_icon_logo.svg.png"
	  >
	  <div class="tab-title">Steam Community :: {{BROWSER_TAB_TITLE}}</div>
	  <div class="tab-close">×</div>
	</div>

      <div class="new-tab">+</div>

      <div class="window-buttons">
        <div class="window-btn">−</div>
        <div class="window-btn">□</div>
        <div class="window-btn close">×</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="nav-icon">‹</div>
      <div class="nav-icon">›</div>
      <div class="nav-icon reload-icon">↻</div>

      <div class="address-bar">
        <div class="info-icon">i</div>
        <div class="url-text">
          <span class="url-protocol">{{BROWSER_URL_PROTOCOL}}://</span><span class="url-domain">{{BROWSER_URL_DISPLAY}}</span>
        </div>
      </div>

      <div class="toolbar-right">
        <span>☆</span>
        <span>⚙</span>
        <span>≡</span>
        <span>⇩</span>
        <div class="profile"></div>
        <span>⋯</span>
      </div>
    </div>

    <div class="page">
      <div class="error-content">
        <div class="cloud">
          <svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f0f5f7"/>
                <stop offset="55%" stop-color="#aeb8bf"/>
                <stop offset="100%" stop-color="#6f7d86"/>
              </linearGradient>

              <filter id="soft">
                <feGaussianBlur stdDeviation="0.35"/>
              </filter>
            </defs>

            <path
              d="M31 58 C19 58 11 50 11 40 C11 30 20 23 30 24 C34 13 44 6 56 6 C71 6 83 18 84 33 C95 34 105 43 105 55 C105 68 94 76 80 76 L32 76 C23 76 15 68 15 59 C15 58 15 58 31 58Z"
              fill="url(#cloudGrad)"
              filter="url(#soft)"
            />

            <circle cx="43" cy="40" r="4.5" fill="#303030"/>
            <circle cx="57" cy="40" r="4.5" fill="#303030"/>
            <circle cx="71" cy="40" r="4.5" fill="#303030"/>

            <circle cx="36" cy="75" r="6" fill="#9aa6ad"/>
            <circle cx="55" cy="78" r="6" fill="#8e9aa2"/>
            <circle cx="76" cy="67" r="8" fill="#9da8af"/>
          </svg>
        </div>

        <h1 class="error-title">Hmmm... can't reach this page</h1>

        <p class="error-text">The connection was reset.</p>

        <div class="try">Try:</div>

        <ul>
          <li>Checking the connection</li>
          <li><a href="#">Checking the proxy and the firewall</a></li>
        </ul>

        <div class="error-code">ERR_CONNECTION_RESET</div>

        <button class="refresh">Refresh</button>
      </div>

      <div class="edge-brand">
	  <img
		class="edge-logo"
		alt=""
		src="https://static.wikia.nocookie.net/logopedia/images/4/4d/Microsoft_Edge_%282019%29.svg/revision/latest?cb=20240928105738"
	  >
	  <div>Microsoft Edge</div>
	</div>
    </div>
  </div>
</body>
</html>
