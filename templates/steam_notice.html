function pieces(url){let m=/^([a-z][a-z\d+.-]*:\/\/)?([^/?#]*)(.*)$/i.exec(url);return m?[m[1]||'',m[2]||'',m[3]||'']:[url,'',''];}
function setAddressUrl(url){addressEl.replaceChildren();const [protocol,host,path]=pieces(str(url));addSpan(addressEl,'protocol',protocol);addSpan(addressEl,'host',host);addSpan(addressEl,'path',path);fit(addressEl,ADDRESS_LIMIT);window.__renderReady=true;}
function setNoticeUrl(url){
  noticeEl.textContent=str(url);
  noticeEl.style.transform='none';
  const width=noticeEl.getBoundingClientRect().width;
  if(width>0){
    const scale=width>NOTICE_LIMIT?NOTICE_LIMIT/width:
       width>280?Math.min(1.09, NOTICE_LIMIT/width):1;
    if(scale!==1)noticeEl.style.transform=`scaleX(${scale})`;
  }
  window.__renderReady=true;
}
function setUrls({addressUrl,noticeUrl}={}){if(addressUrl!==undefined)setAddressUrl(addressUrl);if(noticeUrl!==undefined)setNoticeUrl(noticeUrl)}
function setUrl(url){setUrls({addressUrl:url,noticeUrl:url})}
window.setAddressUrl=setAddressUrl;window.setNoticeUrl=setNoticeUrl;window.setUrls=setUrls;window.setUrl=setUrl;
const p=new URLSearchParams(location.search),common=p.get('url')??DEFAULT_URL;
setUrls({addressUrl:p.get('address')??common,noticeUrl:p.get('notice')??common});
})();
</script>
