  // Замерено по исходному скриншоту: где лежит текст и каким он был.
  const TAB = {"cover":[68,12,168,20],"bg":"#363840","x":73,"baseline":25,"size":11.5,"weight":400,"color":"rgb(218,219,229)"};
  const BAR = {"cover":[150,47,1545,31],"bg":"#22242a","x":158,"baseline":68,"size":14,"weight":400,"color":"rgb(218,219,229)","stripScheme":true};
  const BODY = {"cover":[656,386,470,22],"bg":"#202124","x":660,"baseline":401,"size":15,"weight":400,"color":"rgb(154,160,166)"};
  const ICON = {"cover":[46,9,22,22],"rect":[50,12,16,16]};

  // Шрифт приходит от бота: на сервере нет Segoe UI, а без него строка «поедет» по ширине.
  // Если бот ничего не прислал — остаётся системный стек, текст будет, просто не пиксель в пиксель.
  const FONT = '"Shot", "Segoe UI", Arial, sans-serif';

  function cover(rect, colour) {
    ctx.save();
    ctx.fillStyle = colour;
    ctx.fillRect(rect[0], rect[1], rect[2], rect[3]);
    ctx.restore();
  }

  function fontOf(part) {
    return part.weight + ' ' + part.size + 'px ' + FONT;
  }

  function line(part, text, maxWidth) {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = part.color;
    ctx.font = fontOf(part);

    // Длинную строку подрезаем по ширине полосы, чтобы она не налезала на иконки справа.
    let value = String(text || '');
    if (maxWidth && ctx.measureText(value).width > maxWidth) {
      while (value.length > 8 && ctx.measureText(value + '…').width > maxWidth) {
        value = value.slice(0, -1);
      }
      value += '…';
    }

    ctx.fillText(value, part.x, part.baseline);
    ctx.restore();

  }

  // Хост из ссылки: он же стоит в теле ошибки, как у настоящего браузера.
  function hostOf(url) {
    return String(url || '')
      .replace(/^[a-z]+:[/]{2}/i, '')
      .split('/')[0]
      .split('?')[0]
      .split('#')[0];
  }

  function draw(data) {
    const url = String((data && data.url) || '');
    const nick = String((data && data.nick) || '');
    const title = String((data && data.title) || '') || ('Steam Community :: ' + (nick || 'Steam User'));
    const host = hostOf(url) || 'this site';

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(background, 0, 0, W, H);

    // Фавикон вкладки: у настоящего steamcommunity.com там иконка Steam, а не глобус.
    cover(ICON.cover, TAB.bg);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(favicon, ICON.rect[0], ICON.rect[1], ICON.rect[2], ICON.rect[3]);
    ctx.restore();

    // Вкладка: «Steam Community :: ник».
    cover(TAB.cover, TAB.bg);
    line(TAB, title, TAB.cover[2] - (TAB.x - TAB.cover[0]) - 10);

    // Адресная строка: сама ссылка. Chrome прячет схему, Edge показывает её — как на исходниках.
    cover(BAR.cover, BAR.bg);
    line(BAR, BAR.stripScheme ? url.replace(/^[a-z]+:[/]{2}/i, '') : url, BAR.cover[2] - (BAR.x - BAR.cover[0]) - 10);

    // Тело: строка про опечатку в домене.
    cover(BODY.cover, BODY.bg);
    line(BODY, 'Check if there is a typo in ' + host + '.', BODY.cover[2] - (BODY.x - BODY.cover[0]) - 4);
  }

  // Регистрирует присланный шрифт под именем Shot. Без него шаблон рисует системным.
  async function useFont(data) {
    if (!document.fonts || !data || !data.font) {
      return;
    }

    try {
      const faces = [new FontFace('Shot', 'url(' + data.font + ')', { weight: '400' })];

      if (data.fontBold) {
        faces.push(new FontFace('Shot', 'url(' + data.fontBold + ')', { weight: '700' }));
      }

      for (const face of faces) {
        await face.load();
        document.fonts.add(face);
      }

      await document.fonts.ready;
    } catch (error) {
      // Шрифт не поднялся — рисуем системным, экран всё равно соберётся.
    }
  }

  window.renderBrowserError = function renderBrowserError(data) {
    return new Promise((resolve) => {
      const go = () => {
        draw(data);
        requestAnimationFrame(() => {
          window.__renderReady = true;
          resolve(true);
        });
      };

      const waitImage = () => new Promise((done) => {
        if (background.complete && background.naturalWidth) {
          done();
        } else {
          background.onload = done;
          background.onerror = () => resolve(false);
        }
      });

      Promise.all([waitImage(), useFont(data)]).then(go);
    });
  };
