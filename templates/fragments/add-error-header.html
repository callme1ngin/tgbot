<div id="aeHeader">
  <style>
    #aeHeader{position:relative;z-index:50;width:100%;min-height:104px;background:#171a21;
      font-family:Arial,Helvetica,sans-serif;font-size:13.5px;color:#b8b6b4;display:flex;align-items:center}
    #aeHeader .aeWrap{width:100%;max-width:1000px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:26px}
    #aeHeader .aeLogo{display:flex;align-items:center;flex:none}
    #aeHeader .aeLogo img{width:145px;height:44px;display:block}
    #aeHeader nav{display:flex;align-items:center;gap:22px;flex:1}
    #aeHeader nav a{color:#b8b6b4;text-transform:uppercase;font-size:13.5px;letter-spacing:.4px;text-decoration:none;white-space:nowrap}
    #aeHeader nav a.aeActive{color:#1a9fff}
    #aeHeader .aeRight{display:flex;align-items:center;gap:14px;margin-left:auto}
    #aeHeader .aeInstall{background:linear-gradient(to bottom,#75b022,#588a11);color:#d2e885;border-radius:2px;
      padding:6px 14px;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap}
    #aeHeader .aeInstall span{color:#8fb733;margin-right:6px}
    #aeHeader .aeNick{color:#dcdedf;font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #aeHeader .aeAvatar{width:36px;height:36px;object-fit:cover;background:#2a3f5a;display:block}
  </style>
