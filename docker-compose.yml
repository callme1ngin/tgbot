services:
  tg-html-bot:
    build: .
    environment:
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=3000
      - STEAM_WEB_API_KEY=${STEAM_WEB_API_KEY}
      - TRACKER_POLL_MS=${TRACKER_POLL_MS:-60000}
      - TRACKER_MAX_PER_USER=${TRACKER_MAX_PER_USER:-10}
      - TRACKER_MAX_TOTAL=${TRACKER_MAX_TOTAL:-500}
    # Всё из .env попадает в контейнер: без этого ключ и настройки трекера остаются на хосте,
    # а бот внутри видит пустое окружение и отвечает «Steam не отдал профиль».
    env_file:
      - .env
    restart: unless-stopped
    # Трекер пишет состояние в /app/data. Без тома оно живёт в слое контейнера и стирается каждой
    # пересборкой — то есть при каждом обновлении бота терялись бы все привязанные профили.
    volumes:
      - ./data:/app/data
    # Лимиты ресурсов. Значения не выше того, что есть на сервере: compose отказывается стартовать,
    # если limit больше числа доступных ядер (на одноядерной машине cpus: '2' — это ошибка запуска).
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # Проверка здоровья контейнера
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', () => process.exit(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    sysctls:
      # Оптимизация для большого количества соединений
      - net.core.somaxconn=1024
      - net.ipv4.tcp_max_syn_backlog=2048
